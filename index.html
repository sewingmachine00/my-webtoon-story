<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹툰 스토리 랜덤 뽑기</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Noto Sans KR", sans-serif;
    background: #f4f6fb;
    color: #222;
}

.container {
    max-width: 1150px;
    margin: auto;
    padding: 35px 20px 70px;
    text-align: center;
}

h1 {
    margin: 0;
    font-size: 40px;
}

.subtitle {
    color: #666;
    margin: 10px 0 32px;
}


/* =========================
   카드
========================= */

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.card-area {
    position: relative;
}

.card-box {
    perspective: 1000px;
}

.card {
    height: 270px;
    position: relative;
    transform-style: preserve-3d;
}

.card.flipped {
    transform: rotateY(180deg);
}

.card-front,
.card-back {
    position: absolute;
    width: 100%;
    height: 100%;

    border-radius: 22px;
    backface-visibility: hidden;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 20px;

    background: white;
    box-shadow: 0 8px 20px rgba(0,0,0,.08);
}

.card-front {
    border: 3px dashed #cbd0dc;
}

.card-back {
    border: 3px solid #5b7cff;
    transform: rotateY(180deg);
}

.icon {
    font-size: 48px;
    margin-bottom: 10px;
}

.category {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

.question {
    font-size: 50px;
    color: #aaa;
}

.result {
    font-size: 21px;
    font-weight: bold;
    line-height: 1.5;
}


/* =========================
   카드 회전
   ★ 180도 한 번만
========================= */

.card.roulette {
    animation: cardSpinOnce .75s ease-in-out;
}

@keyframes cardSpinOnce {

    0% {
        transform: rotateY(0deg);
    }

    100% {
        transform: rotateY(180deg);
    }

}


/* =========================
   카드 버튼
========================= */

.card-button {
    margin-top: 12px;

    padding: 9px 17px;

    border: none;
    border-radius: 10px;

    background: #e9edf6;
    color: #555;

    cursor: pointer;
    font-size: 14px;
}

.card-button:hover {
    background: #dce2ef;
}


/* =========================
   메인 버튼
========================= */

.main-button {
    margin-top: 32px;

    padding: 17px 45px;

    border: none;
    border-radius: 15px;

    background: #5b7cff;
    color: white;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 5px 0 #385bd1;
}

.main-button:hover {
    transform: translateY(2px);
}

.main-button:active {
    transform: translateY(5px);
    box-shadow: none;
}

.main-button:disabled {
    background: #aaa;
    box-shadow: none;
    cursor: default;
}


/* =========================
   나의 웹툰 스토리
========================= */

.my-story {
    display: none;

    margin-top: 40px;

    background: white;

    padding: 30px;

    border-radius: 22px;

    box-shadow: 0 8px 20px rgba(0,0,0,.06);
}

.my-story h2 {
    margin: 0 0 25px;
    font-size: 28px;
}

.story-summary {
    font-size: 23px;
    line-height: 1.9;
    font-weight: bold;
    word-break: keep-all;
}

.story-line {
    margin: 3px 0;
}

.story-highlight {
    color: #5b7cff;
}

.story-twist-intro {
    margin-top: 8px;
}

.story-twist {
    color: #5b7cff;
}


/* =========================
   컷 수 선택
========================= */

.story-setting {
    display: none;

    margin-top: 25px;

    background: white;

    padding: 28px;

    border-radius: 22px;

    box-shadow: 0 8px 20px rgba(0,0,0,.06);
}

.story-setting h2 {
    margin-top: 0;
}

.count-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 20px 0;
}

.count-button {
    padding: 13px 28px;

    border: 2px solid #d7dce8;

    border-radius: 12px;

    background: white;

    cursor: pointer;

    font-size: 17px;
    font-weight: bold;
}

.count-button.active {
    background: #5b7cff;
    color: white;
    border-color: #5b7cff;
}


/* =========================
   스토리 결과
========================= */

.story-result {
    display: none;

    margin-top: 40px;

    text-align: left;
}

.story-title {
    text-align: center;
    font-size: 30px;
}

.story-notice {
    background: #fff8df;

    border: 2px solid #f0d878;

    border-radius: 15px;

    padding: 18px;

    margin: 20px 0;

    text-align: center;

    font-weight: bold;

    line-height: 1.6;
}

.cut-list {
    display: grid;
    gap: 15px;
}

.cut {
    background: white;

    border-radius: 18px;

    padding: 22px;

    box-shadow: 0 5px 15px rgba(0,0,0,.05);

    border-left: 7px solid #5b7cff;
}

.cut-number {
    font-size: 20px;

    font-weight: bold;

    color: #5b7cff;

    margin-bottom: 12px;
}

.cut-content {
    line-height: 1.7;
}

.scene {
    margin-bottom: 9px;
}

.dialogue {
    font-weight: bold;
    margin-top: 10px;
}

.story-buttons {
    text-align: center;
    margin-top: 25px;
}

.secondary-button {
    padding: 13px 25px;

    border: none;

    border-radius: 12px;

    background: #e9edf6;

    cursor: pointer;

    font-size: 16px;

    margin: 5px;
}

.secondary-button:hover {
    background: #dce2ef;
}


/* =========================
   반응형
========================= */

@media(max-width:800px) {

    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media(max-width:500px) {

    .cards {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 30px;
    }

    .count-buttons {
        flex-wrap: wrap;
    }

    .story-summary {
        font-size: 20px;
    }

}
</style>
</head>


<body>

<div class="container">

    <h1>🎲 웹툰 스토리 뽑기</h1>

    <p class="subtitle">
        카드를 뽑고, 이야기를 만들고, 나만의 웹툰을 완성해 보세요!
    </p>


    <!-- =========================
         카드
    ========================== -->

    <div class="cards">

        <!-- 장소 -->
        <div class="card-area">

            <div class="card-box">

                <div class="card" id="placeCard">

                    <div class="card-front">
                        <div class="icon">📍</div>
                        <div class="category">장소</div>
                        <div class="question">?</div>
                    </div>

                    <div class="card-back">
                        <div class="icon">📍</div>
                        <div class="category">장소</div>
                        <div class="result" id="placeResult"></div>
                    </div>

                </div>

            </div>

            <button
                class="card-button"
                onclick="redrawOne('place')">
                🔄 다시 뽑기
            </button>

        </div>


        <!-- 주인공 -->
        <div class="card-area">

            <div class="card-box">

                <div class="card" id="characterCard">

                    <div class="card-front">
                        <div class="icon">🧑</div>
                        <div class="category">주인공</div>
                        <div class="question">?</div>
                    </div>

                    <div class="card-back">
                        <div class="icon">🧑</div>
                        <div class="category">주인공</div>
                        <div class="result" id="characterResult"></div>
                    </div>

                </div>

            </div>

            <button
                class="card-button"
                onclick="redrawOne('character')">
                🔄 다시 뽑기
            </button>

        </div>


        <!-- 사건 -->
        <div class="card-area">

            <div class="card-box">

                <div class="card" id="eventCard">

                    <div class="card-front">
                        <div class="icon">💥</div>
                        <div class="category">사건</div>
                        <div class="question">?</div>
                    </div>

                    <div class="card-back">
                        <div class="icon">💥</div>
                        <div class="category">사건</div>
                        <div class="result" id="eventResult"></div>
                    </div>

                </div>

            </div>

            <button
                class="card-button"
                onclick="redrawOne('event')">
                🔄 다시 뽑기
            </button>

        </div>


        <!-- 반전 -->
        <div class="card-area">

            <div class="card-box">

                <div class="card" id="twistCard">

                    <div class="card-front">
                        <div class="icon">😱</div>
                        <div class="category">반전</div>
                        <div class="question">?</div>
                    </div>

                    <div class="card-back">
                        <div class="icon">😱</div>
                        <div class="category">반전</div>
                        <div class="result" id="twistResult"></div>
                    </div>

                </div>

            </div>

            <button
                class="card-button"
                onclick="redrawOne('twist')">
                🔄 다시 뽑기
            </button>

        </div>

    </div>


    <!-- 카드 뽑기 -->

    <button
        class="main-button"
        id="drawButton"
        onclick="startGame()">

        🎰 카드 뽑기

    </button>


    <!-- =========================
         나의 웹툰 스토리
    ========================== -->

    <div class="my-story" id="myStory">

        <h2>
            ✨ 나의 웹툰 스토리
        </h2>

        <div class="story-summary">

            <div class="story-line">
                <span class="story-highlight" id="storyPlace"></span>에서
            </div>

            <div class="story-line">
                주인공은
                <span class="story-highlight" id="storyCharacter"></span>이고,
            </div>

            <div class="story-line">
                어느 날
                <span class="story-highlight" id="storyEvent"></span>.
            </div>

            <div class="story-twist-intro">
                그런데 알고 보니...
            </div>

            <div class="story-twist">
                <span id="storyTwist"></span>!
            </div>

        </div>

    </div>


    <!-- =========================
         컷 수
    ========================== -->

    <div
        class="story-setting"
        id="storySetting">

        <h2>
            🎬 몇 컷으로 만들어 볼까요?
        </h2>

        <p>
            아래 예시는 이야기를 시작하는 데 도움을 주기 위한 것입니다.
        </p>

        <div class="count-buttons">

            <button
                class="count-button"
                id="count4"
                onclick="selectCount(4)">
                4컷
            </button>

            <button
                class="count-button active"
                id="count6"
                onclick="selectCount(6)">
                6컷
            </button>

            <button
                class="count-button"
                id="count8"
                onclick="selectCount(8)">
                8컷
            </button>

        </div>

        <button
            class="main-button"
            onclick="makeStory()">
            ✨ 예시 스토리 보기
        </button>

    </div>


    <!-- =========================
         예시 스토리
    ========================== -->

    <div
        class="story-result"
        id="storyResult">

        <h2 class="story-title">
            🎬 웹툰 스토리 예시
        </h2>

        <div class="story-notice">

            💡 이것은 웹툰 제작을 위한
            <strong>예시 스토리</strong>입니다.<br>

            그대로 따라 만들기보다
            여러분만의 아이디어와 결말을 더해 보세요!

        </div>

        <div
            class="cut-list"
            id="cutList">
        </div>

        <div class="story-buttons">

            <button
                class="secondary-button"
                onclick="makeStory()">
                🔄 다른 스토리 예시 보기
            </button>

            <button
                class="secondary-button"
                onclick="showSetting()">
                ✏️ 컷 수 바꾸기
            </button>

            <button
                class="secondary-button"
                onclick="resetGame()">
                🎲 처음부터 다시 뽑기
            </button>

        </div>

    </div>

</div>


<script>

/* ==================================================
   카드 데이터
================================================== */

const places = [
    "학교 교실",
    "급식실",
    "학교 운동장",
    "편의점",
    "지하철",
    "엘리베이터",
    "놀이공원",
    "PC방",
    "도서관",
    "미래의 학교",
    "우주선",
    "바닷속 도시",
    "게임 속 세상",
    "AI 연구소",
    "10년 후의 우리 동네",
    "시간이 멈춘 학교",
    "꿈속",
    "무인 카페",
    "좀비가 된 도시",
    "정체를 알 수 없는 장소"
];


const characters = [
    "평범한 고등학생",
    "외계인 전학생",
    "말하는 AI",
    "미래에서 온 나",
    "말하는 고양이",
    "게임 속 NPC",
    "학교 선생님",
    "유명한 아이돌",
    "시간여행자",
    "초능력을 숨기고 있는 학생",
    "시험을 싫어하는 천재",
    "무엇이든 먹는 로봇",
    "거짓말을 못 하는 사람",
    "하루에 한 번만 말할 수 있는 사람",
    "내 스마트폰",
    "갑자기 작아진 사람",
    "갑자기 투명해진 사람",
    "사람이 된 강아지",
    "정체를 숨기고 있는 전학생",
    "나와 똑같이 생긴 사람"
];


const events = [
    "갑자기 시간이 멈췄다",
    "모두의 기억이 사라졌다",
    "시험 문제가 살아 움직이기 시작했다",
    "스마트폰이 말을 하기 시작했다",
    "갑자기 좀비가 나타났다",
    "모든 사람이 거짓말을 할 수 없게 되었다",
    "하루가 계속 반복되기 시작했다",
    "학교가 우주선으로 변했다",
    "급식이 갑자기 움직이기 시작했다",
    "나와 똑같은 사람이 나타났다",
    "갑자기 모든 사람이 나를 알아보기 시작했다",
    "내가 게임 캐릭터가 되었다",
    "정체불명의 상자가 나타났다",
    "10분 뒤 지구가 멸망한다는 문자를 받았다",
    "내가 한 말이 현실이 되기 시작했다",
    "갑자기 초능력이 생겼다",
    "모든 전자기기가 작동하지 않았다",
    "하늘에서 이상한 물건이 떨어졌다",
    "누군가 나에게 미래를 알려주었다",
    "아무도 모르는 비밀 통로를 발견했다"
];


const twists = [
    "사실 처음부터 꿈이었다",
    "범인은 바로 나였다",
    "AI가 사실 미래의 나였다",
    "모든 일이 10년 전부터 계획되어 있었다",
    "주인공이 사실 로봇이었다",
    "외계인이 지구를 구하러 온 것이었다",
    "시간을 멈춘 사람은 친구였다",
    "진짜 주인공은 옆에 있던 고양이였다",
    "사건은 사실 수행평가였다",
    "모두가 알고 있었는데 나만 몰랐다",
    "미래의 내가 보내온 메시지였다",
    "내가 만든 이야기가 현실이 되고 있었다",
    "사실 아무 일도 일어나지 않았다",
    "가장 평범해 보였던 사람이 범인이었다",
    "AI가 나보다 학교생활을 더 잘하고 있었다",
    "처음의 장면으로 다시 돌아왔다",
    "주인공만 시간이 거꾸로 흐르고 있었다",
    "모든 사람이 NPC였다",
    "진짜 세계는 따로 있었다",
    "마지막 장면에서 독자에게 말을 걸었다"
];


let selected = {
    place: "",
    character: "",
    event: "",
    twist: ""
};

let storyCount = 6;


/* ==================================================
   랜덤
================================================== */

function randomItem(array) {

    return array[
        Math.floor(Math.random() * array.length)
    ];

}


/* ==================================================
   효과음
================================================== */

let audioContext;

function playSound(type) {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        const now =
            audioContext.currentTime;


        if (type === "spin") {

            oscillator.type = "sine";

            oscillator.frequency.setValueAtTime(
                250,
                now
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                700,
                now + 0.5
            );

            gain.gain.setValueAtTime(
                0.05,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + 0.6
            );

            oscillator.start(now);
            oscillator.stop(now + 0.6);

        }


        if (type === "stop") {

            oscillator.type = "triangle";

            oscillator.frequency.setValueAtTime(
                500,
                now
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                900,
                now + 0.15
            );

            gain.gain.setValueAtTime(
                0.15,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + 0.35
            );

            oscillator.start(now);
            oscillator.stop(now + 0.35);

        }

    } catch (e) {}

}


/* ==================================================
   카드 한 장 뽑기
   ★ 180도 한 번만 회전
================================================== */

function drawOne(type) {

    let array;
    let cardId;
    let resultId;


    if (type === "place") {
        array = places;
        cardId = "placeCard";
        resultId = "placeResult";
    }

    if (type === "character") {
        array = characters;
        cardId = "characterCard";
        resultId = "characterResult";
    }

    if (type === "event") {
        array = events;
        cardId = "eventCard";
        resultId = "eventResult";
    }

    if (type === "twist") {
        array = twists;
        cardId = "twistCard";
        resultId = "twistResult";
    }


    const card =
        document.getElementById(cardId);

    const result =
        document.getElementById(resultId);


    card.classList.remove("flipped");
    card.classList.remove("roulette");

    void card.offsetWidth;


    const finalValue =
        randomItem(array);

    selected[type] =
        finalValue;


    result.textContent =
        finalValue;


    /*
     * 카드가 180도 한 번 회전
     */

    card.classList.add("roulette");

    playSound("spin");


    setTimeout(() => {

        card.classList.remove("roulette");

        card.classList.add("flipped");

        playSound("stop");

    }, 750);

}


/* ==================================================
   전체 카드 뽑기
================================================== */

function startGame() {

    document.getElementById(
        "drawButton"
    ).disabled = true;


    document.getElementById(
        "myStory"
    ).style.display = "none";


    document.getElementById(
        "storySetting"
    ).style.display = "none";


    document.getElementById(
        "storyResult"
    ).style.display = "none";


    drawOne("place");


    setTimeout(() => {
        drawOne("character");
    }, 1100);


    setTimeout(() => {
        drawOne("event");
    }, 2200);


    setTimeout(() => {
        drawOne("twist");
    }, 3300);


    setTimeout(() => {

        document.getElementById(
            "drawButton"
        ).disabled = false;

        showMyStory();

    }, 4400);

}


/* ==================================================
   카드 하나 다시 뽑기
================================================== */

function redrawOne(type) {

    drawOne(type);

    setTimeout(() => {

        if (
            selected.place &&
            selected.character &&
            selected.event &&

/* ==================================================
   컷 수 선택
================================================== */

function selectCount(count) {

    storyCount = count;

    document
        .querySelectorAll(".count-button")
        .forEach(button => {

            button.classList.remove("active");

        });


    document
        .getElementById("count" + count)
        .classList.add("active");

}


/* ==================================================
   예시 스토리 만들기
================================================== */

function makeStory() {

    if (
        !selected.place ||
        !selected.character ||
        !selected.event ||
        !selected.twist
    ) {

        alert("먼저 카드를 뽑아 주세요!");

        return;

    }


    const story =
        generateStory(storyCount);


    const cutList =
        document.getElementById("cutList");


    cutList.innerHTML = "";


    story.forEach((cut, index) => {

        const div =
            document.createElement("div");

        div.className = "cut";


        div.innerHTML = `

            <div class="cut-number">
                ${index + 1}컷
            </div>

            <div class="cut-content">

                <div class="scene">
                    📷 <strong>장면</strong><br>
                    ${cut.scene}
                </div>

                <div class="scene">
                    💡 <strong>상황</strong><br>
                    ${cut.action}
                </div>

                <div class="dialogue">
                    💬 ${cut.dialogue}
                </div>

            </div>

        `;


        cutList.appendChild(div);

    });


    document.getElementById(
        "storyResult"
    ).style.display = "block";


    window.scrollTo({

        top:
            document.getElementById(
                "storyResult"
            ).offsetTop - 20,

        behavior: "smooth"

    });

}

function getEventType() {

    const e = selected.event;

    if (e.includes("시간이 멈췄"))
        return "time";

    if (e.includes("기억"))
        return "memory";

    if (e.includes("시험 문제"))
        return "exam";

    if (e.includes("스마트폰"))
        return "phone";

    if (e.includes("좀비"))
        return "zombie";

    if (e.includes("거짓말"))
        return "lie";

    if (e.includes("반복"))
        return "loop";

    if (e.includes("우주선"))
        return "spaceship";

    if (e.includes("급식"))
        return "food";

    if (e.includes("똑같은 사람이"))
        return "double";

    if (e.includes("모든 사람이 나를"))
        return "famous";

    if (e.includes("게임 캐릭터"))
        return "game";

    if (e.includes("상자"))
        return "box";

    if (e.includes("지구가 멸망"))
        return "end";

    if (e.includes("내가 한 말"))
        return "word";

    if (e.includes("초능력"))
        return "power";

    if (e.includes("전자기기"))
        return "electric";

    if (e.includes("하늘에서"))
        return "sky";

    if (e.includes("미래"))
        return "future";

    if (e.includes("비밀 통로"))
        return "secret";

    return "normal";

}

            },

            {
                scene: `신호의 근원`,

        /* --------------------------------

        sky: [

            },

            {
                scene: `숨겨진 기능`,
                action: `물건이 하늘을 향해 신호를 보내기 시작한다.`,
                dialogue: `"누군가에게 신호를 보내고 있어!"`
            },

            {
                scene: `하늘에 나타난 답`,
                action: `하늘에 거대한 무언가가 나타난다.`,
                dialogue: `"설마 저게 이 물건의 주인?"`
            },

            {
                scene: `충격적인 반전`,
                action: `${t}.`,
                dialogue: `"처음부터 우리를 구하려고 온 거였다고?!"`
            }

        ],


        /* --------------------------------
           19. 미래의 메시지
        -------------------------------- */

        future: [

            {
                scene: `${p}`,
                action: `${c}에게 정체불명의 메시지가 도착한다.`,
                dialogue: `"보낸 사람이... 미래의 나라고?"`
            },

            {
                scene: `미래의 모습`,
                action: `메시지에는 앞으로 일어날 위험한 사건이 담겨 있다.`,

            },

            },

            {

            },

            {

                dialogue: `"처음 메시지부터 다시 봐야 해!"`
            },

            {
                scene: `미래의 나를 만나기 직전`,
                action: `${c}은(는) 메시지를 보낸 미래의 자신과 연결되는 장소에 도착한다.`,
                dialogue: `"드디어 만나게 되는 건가?"`
            },

            {
                scene: `충격적인 반전`,
                action: `${t}.`,
                dialogue: `"그럼 이 메시지는 누가 보낸 거야?!"`
            }

        ],


        /* --------------------------------
           20. 비밀 통로
        -------------------------------- */

        secret: [

            {
                scene: `${p}`,
                action: `${c}이(가) 우연히 아무도 모르는 문을 발견한다.`,
                dialogue: `"여기에 이런 문이 있었어?"`
            },

            {
                scene: `숨겨진 비밀 통로`,
                action: `문을 열자 아무도 모르는 긴 통로가 나타난다.`,
                dialogue: `"안으로 들어가 볼까?"`
            },

            {
                scene: `통로 안쪽`,

                dialogue: `"끝까지 가 보면 답이 나올 거야."`
            },

            {
                scene: `숨겨진 방`,
                action: `통로 끝에서 오래된 기록과 이상한 물건이 있는 방을 발견한다.`,
                dialogue: `"여기서 무슨 일이 있었던 거지?"`
            },

            {
                scene: `기록 속의 충격적인 내용`,
                action: `기록에는 지금까지의 사건과 관련된 내용이 적혀 있다.`,
                dialogue: `"설마 이 사건을 알고 있었던 거야?"`
            },

            {
                scene: `충격적인 반전`,
                action: `${t}.`,
                dialogue: `"처음부터 이 통로가 그걸 위해 있었던 거야?!"`
            }

        ]

    };


    /*
     * 해당 사건의 패턴 가져오기
     */

    let story =
        stories[type];


    /*
     * 혹시 정의되지 않은 사건이 생기더라도
     * 기본 구조 사용
     */

    if (!story) {

        story = [

            {
                scene: `${p}`,
                action: `${c}이(가) 평범한 하루를 보내고 있다.`,
                dialogue: `"오늘은 별일 없겠지?"`
            },

            {
                scene: `${p}에서 이상한 일이 발생한다.`,
                action: `${e}.`,
                dialogue: `"잠깐, 무슨 일이야?"`
            },

            {
                scene: `점점 커지는 사건`,
                action: `상황이 예상보다 크게 번지기 시작한다.`,
                dialogue: `"이대로는 안 되겠어!"`
            },

            {
                scene: `문제 해결을 위한 행동`,
                action: `${c}이(가) 직접 문제를 해결하려고 움직인다.`,
                dialogue: `"내가 직접 확인해 볼게."`
            },

            {
                scene: `해결 직전`,
                action: `마침내 사건의 원인을 알아낸다.`,
                dialogue: `"이제 알겠어!"`
            },

            {
                scene: `충격적인 반전`,
                action: `${t}.`,
                dialogue: `"뭐라고?!"`
            },

            {
                scene: `새로운 진실`,
                action: `반전의 의미를 깨닫는다.`,
                dialogue: `"그럼 지금까지 전부 연결되어 있었던 거야?"`
            },

            {
                scene: `마지막 장면`,
                action: `새로운 이야기가 시작될 것 같은 순간.`,
                dialogue: `"이제부터가 진짜 시작이야!"`
            }

        ];

    }


    /*
     * 4컷
     *
     * 상황 → 사건 → 문제 → 반전
     */

    if (count === 4) {

        return [

            story[0],
            story[2],
            story[4],
            story[7]

        ];

    }


    /*
     * 6컷
     *
     * ① 상황
     * ② 등장
     * ③ 사건
     * ④ 문제 확대
     * ⑤ 해결 시도
     * ⑥ 반전
     */

    if (count === 6) {

        return [

            story[0],
            story[1],
            story[2],
            story[3],
            story[4],
            story[7]

        ];

    }


    /*
     * 8컷
     *
     * 사건의 흐름을 가장 자세하게 보여줌
     */

    return story;

}

function showSetting() {

    document.getElementById(
        "storyResult"
    ).style.display = "none";


    document.getElementById(
        "storySetting"
    ).style.display = "block";


    window.scrollTo({

        top:
            document.getElementById(
                "storySetting"
            ).offsetTop - 20,

        behavior: "smooth"

    });

}


/* ==================================================
   처음부터 다시
================================================== */

function resetGame() {

    selected = {
        place: "",
        character: "",
        event: "",
        twist: ""
    };


    document
        .querySelectorAll(".card")
        .forEach(card => {

            card.classList.remove("flipped");
            card.classList.remove("roulette");

        });


    document.getElementById(
        "placeResult"
    ).textContent = "";


    document.getElementById(
        "characterResult"
    ).textContent = "";


    document.getElementById(
        "eventResult"
    ).textContent = "";


    document.getElementById(
        "twistResult"
    ).textContent = "";


    document.getElementById(
        "storyPlace"
    ).textContent = "";


    document.getElementById(
        "storyCharacter"
    ).textContent = "";


    document.getElementById(
        "storyEvent"
    ).textContent = "";


    document.getElementById(
        "storyTwist"
    ).textContent = "";


    document.getElementById(
        "myStory"
    ).style.display = "none";


    document.getElementById(
        "storySetting"
    ).style.display = "none";


    document.getElementById(
        "storyResult"
    ).style.display = "none";


    document.getElementById(
        "drawButton"
    ).disabled = false;


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}
